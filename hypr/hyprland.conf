##########################
### ФАЙЛЫ КОНФИГУРАЦИИ ###
##########################

source = ~/.config/hypr/colors/color.conf

source = ~/.config/hypr/hyprland_configs/my_programs.conf # ПЕРЕМЕННЫЕ С ОСНОВНЫМИ ПРОГРАММАМИ

source = ~/.config/hypr/hyprland_configs/autostart.conf # АВТОЗАПУСК

source = ~/.config/hypr/hyprland_configs/appearance_of_windows.conf # ВНЕШНИЙ ВИД ОКОН
# source = ~/.config/hypr/hyprland_configs/appearance_of_windows_nr.conf # ВНЕШНИЙ ВИД ОКОН

source = ~/.config/hypr/hyprland_configs/windowrule.conf # ПРАВИЛА ОКОН

source = ~/.config/hypr/hyprland_configs/hotkeys.conf # ГОРЯЧИЕ КЛАВИШИ

source = ~/.config/hypr/hyprland_configs/hotkeys_scrolling.conf

# source = ~/.config/hypr/hyprland_configs/plugin.conf 


#####################
### ПРАВА ДОСТУПА ###
#####################

# См. https://wiki.hypr.land/Configuring/Permissions/
# Изменения прав требуют перезапуска Hyprland (по соображениям безопасности)

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


################
### МОНИТОРЫ ###
################
monitors { 
#    monitor = LVDS-1, 1000x600@59, 0x0, 1
    monitor = LVDS-1, 1366x768@59, 0x0, 1
    monitor = HDMI-A-1,1920x1080, -1920x0, 1
}
# См. https://wiki.hypr.land/Configuring/Monitors/
#monitor=,preferred,auto,auto

#############
### ВВОД ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
        kb_variant =
        kb_model =
        kb_options = grp:win_space_toggle
        follow_mouse = 1
        sensitivity = 0
        touchpad {
            natural_scroll = true
        }
}

############################
### ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ###
############################

env = XCURSOR_SIZE,24

env = HYPRCURSOR_SIZE,24


