######## ВВОД ########
shape { 
    monitor =
        size = 200, 50  # Ширина плашки, высота
        color = $background_standart_color # Полупрозрачный
        rounding = 25
        position = 0, 25
        halign = center
        valign = bottom
        onclick = systemctl suspend  # Команда при клике
}
image {
    monitor =
        path = $HOME/.face
        size = 40
        border_color = rgba(0, 0, 0, 1.0) #    $accent
        border_size = 0
        position = -75, 30
        halign = center
        valign = bottom
        # onclick = loginctl terminate-user $USER
}

input-field {
    fail_text = error 
        fail_timeout = 100  # опционально, быстрее исчезновение
        monitor =
        size = 250, 50
        outline_thickness = 0
        outer_color = $itc
        font_color = $itc
        inner_color = rgba(00000000)
        fade_on_empty = false
        placeholder_text = Password
        font_size = 26
        # font_family = $стандартный_шрифт
        hide_input = false
        check_color = rgb(b30000)
        fail_color = rgb(b30000)    # macOS red
        dots_center = true
        dots_spacing = 0.4

        position = 20, 25
        halign = center
        valign = bottom
        rounding = 25
}

