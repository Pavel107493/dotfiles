######## ВВОД ########

input-field {
    fail_text = error 
        fail_timeout = 300  # опционально, быстрее исчезновение
        monitor =
        size = 160, 40
        outline_thickness = 0
        outer_color = $itc
        font_color = $itc
        inner_color = $background_standart_color
        fade_on_empty = false
        placeholder_text =  $USER
        font_size = 24
        font_family = $стандартный_шрифт
        hide_input = false
        check_color = rgb(b30000)
        fail_color = rgb(b30000)    # macOS red
        dots_center = true
        dots_spacing = 0.4

        position = 25, $shifting_downwards
        halign = center
        valign = center
        rounding = $кругление_плашек
}

