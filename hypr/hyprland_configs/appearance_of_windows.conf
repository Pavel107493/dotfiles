#####################
### ВНЕШНИЙ ВИД ###
#####################

general {
    gaps_in = 3           # Внутренние промежутки между окнами
    gaps_out = 6         # Внешние промежутки от краёв экрана
    border_size = 2       # Толщина рамки окон
    resize_on_border = false
    allow_tearing = false
    layout = scrolling        # Макет по умолчанию (dwindle) i use (scrolling)

    col.active_border = $itc       # Активная рамка (градиент)
    col.inactive_border = $bg3 #$icon_text_color #rgb(242424) 270deg      # Неактивная рамка (градиент)
}

decoration {
    rounding = 10         # Скругление углов окон 
    rounding_power = 2   # Сила скругления (если >1)
    dim_inactive = true   # затемнение неактивных окон
    dim_strength = 0.3    # сила затемнения от 0.0 до 1.0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 10
        render_power = 2
        color = rgba(000000ee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)  # Анимации включены :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1     # Замедление в конце
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1     # Плавное ускорение/замедление
    bezier = linear,         0,    0,    1,    1     # Линейная
    bezier = almostLinear,   0.5,  0.5,  0.75, 1     # Почти линейная
    bezier = quick,          0.15, 0,    0.1,  1.0     # Быстрая

    animation = global,        1,     3,     default              # Глобальная
    animation = border,        1,     5.39,  easeOutQuint         # Рамка
    animation = windows,       1,     4.79,  easeOutQuint         # Перемещение окон
    animation = windowsIn,     1,     2.1,   quick, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%   # Исчезновение окон
    animation = fadeIn,        1,     1.73,  almostLinear         # Затухание в
    animation = fadeOut,       1,     1.46,  almostLinear         # Затухание из
    animation = fade,          1,     3.03,  quick                # Общее затухание
    animation = layers,        1,     3.81,  easeOutQuint         # Слои (оверлеи)
    animation = layersIn,      1,     3.81,  easeOutQuint, fade
    animation = layersOut,     1,     3.81,   linear,       fade   # Исчезновение слоёв
    animation = fadeLayersIn,  1,     1.79,  almostLinear         # Затухание слоёв в
    animation = fadeLayersOut, 1,     1.39,  almostLinear         # Затухание слоёв из
    animation = workspaces,    1,     3.94,  quick, slider        # Рабочие столы
    animation = workspacesIn,  1,     2.21,  quick, slider        # Вход в стол
    animation = workspacesOut, 1,     2.21,  quick, slider        # Выход из стола
    animation = zoomFactor,    1,     7,     quick                # Масштабирование
}
# dwindle {
#     pseudotile = true     # Главный переключатель псевдотайлинга (привязан к mainMod+P)
#     preserve_split = true # Вероятно вам нужно
# }

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # 0 или 1 отключает аниме-обои
    disable_hyprland_logo = true # true убирает логотип/аниме-девушку
}
