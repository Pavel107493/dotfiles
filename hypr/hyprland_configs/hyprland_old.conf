
# https://wiki.hypr.land/Configuring/


# Конфигурацию можно разделить на несколько файлов.  Создайте файлы отдельно и подключите их: source = ~/.config/hypr/myColors.conf

################
### МОНИТОРЫ ###
################

# См. https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

###################
### МОИ ПРОГРАММЫ ###
###################

# См. https://wiki.hypr.land/Configuring/Keywords/

# Ваши основные программы
$terminal = gnome-terminal
$fileManager = nemo
$menu = wofi --show drun
$hyprlock = hyprlock
$browser = firefox
$Telegram = Telegram

#################
### АВТОЗАПУСК ###
#################

# Автозапуск необходимых процессов (уведомления, панели и т.д.)
# Или запуск любимых приложений при старте:

exec-once = hyprpanel
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle


#############################
### ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ###
#############################

# См. https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### ПРАВА ДОСТУПА ###
###################

# См. https://wiki.hypr.land/Configuring/Permissions/
# Изменения прав требуют перезапуска Hyprland (по соображениям безопасности)

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### ВНЕШНИЙ ВИД ###
#####################

# См. https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2           # Внутренние промежутки между окнами
        gaps_out = 4         # Внешние промежутки от краёв экрана

        border_size = 1       # Толщина рамки окон

# См. типы цветов: https://wiki.hypr.land/Configuring/Variables/#variable-types
        col.active_border = rgba(262626ff) 90deg       # Активная рамка (градиент)
        col.inactive_border = rgba(262626ff) 90deg      # Неактивная рамка (градиент)

# true = изменение размера окон за рамки/промежутки
        resize_on_border = true

# ВНИМАНИЕ: читайте https://wiki.hypr.land/Configuring/Tearing/ перед включением!
        allow_tearing = false

        layout = dwindle       # Макет по умолчанию (dwindle)
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10         # Скругление углов окон
        rounding_power = 2    # Сила скругления (если >1)
        dim_inactive = true   # затемнение неактивных окон
        dim_strength = 0.2    # сила затемнения от 0.0 до 1.0, подберите под себя

# Прозрачность активных/неактивных окон
        active_opacity = 0.9
        inactive_opacity = 0.9

        shadow {              # Тени окон
            enabled = false
                range = 6         # Размер тени
                render_power = 3  # Качество рендера
                color = rgba(1a1a1aee)
        }

# https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true    # Размытие фона
            size = 3
            passes = 2
            vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)  # Анимации включены :)

# Кастомные кривые Безье для плавности
# Формат: bezier = имя, X0, Y0, X1, Y1
# Подробности: https://wiki.hypr.land/Configuring/Animations/#curves
        bezier = easeOutQuint,   0.23, 1,    0.32, 1     # Замедление в конце
        bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1     # Плавное ускорение/замедление
        bezier = linear,         0,    0,    1,    1     # Линейная
        bezier = almostLinear,   0.5,  0.5,  0.75, 1     # Почти линейная
        bezier = quick,          0.15, 0,    0.1,  1     # Быстрая
        bezier = overshot,       0.23, 0.60, 0.00, 1.10  # С отскоком

# Настройки анимаций: animation = имя, вкл/выкл, скорость, кривая, [стиль]
# Подробности: https://wiki.hypr.land/Configuring/Animations/
        animation = global,        1,     10,    default           # Глобальная
        animation = border,        1,     5.39,  easeOutQuint      # Рамка
        animation = windows,       1,     4.79,  easeOutQuint      # Перемещение окон
        animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%   # Появление окон
        animation = windowsOut,    1,     1.49,  linear,       popin 87%   # Исчезновение окон
        animation = fadeIn,        1,     1.73,  almostLinear         # Затухание в
        animation = fadeOut,       1,     1.46,  almostLinear         # Затухание из
        animation = fade,          1,     3.03,  quick                # Общее затухание
        animation = layers,        1,     3.81,  easeOutQuint         # Слои (оверлеи)
        animation = layersIn,      1,     4,     easeOutQuint, fade   # Появление слоёв
        animation = layersOut,     1,     1.5,   linear,       fade   # Исчезновение слоёв
        animation = fadeLayersIn,  1,     1.79,  almostLinear         # Затухание слоёв в
        animation = fadeLayersOut, 1,     1.39,  almostLinear         # Затухание слоёв из
        animation = workspaces,    1,     1.94,  almostLinear, slider # Рабочие столы
        animation = workspacesIn,  1,     2.21,  almostLinear, slider    # Вход в стол
        animation = workspacesOut, 1,     2.21,  almostLinear, slider # Выход из стола
        animation = zoomFactor,    1,     7,     quick               # Масштабирование
}

# Правила рабочих столов: https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Умные промежутки" (без промежутков когда одно окно)
# Раскомментируйте если нужно:
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0

# Правила окон для "умных промежутков"
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#     border_size = 0
#     rounding = 0
# }

# Макет dwindle: https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true     # Главный переключатель псевдотайлинга (привязан к mainMod+P)
        preserve_split = true # Вероятно вам нужно
}

# Макет master: https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}

# Разное: https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # 0 или 1 отключает аниме-обои
        disable_hyprland_logo = true # true убирает логотип/аниме-девушку
}

#############
### ВВОД ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
        kb_variant =
        kb_model =
        kb_options = grp:win_space_toggle

        follow_mouse = 1
        sensitivity = 0

        touchpad {
            natural_scroll = false
        }
}

# Жесты: https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Пример настройки конкретного устройства
# https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

###################
### ПРИВЯЗКИ КЛАВИШ ###
###################

# https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER         # Win как основной модификатор

# Основные привязки, подробности: https://wiki.hypr.land/Configuring/Binds/
bind = $mainMod, Q, exec, $terminal     # Win + Q → Терминал
bind = $mainMod, C, killactive,         # Win + C → Закрыть окно
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit  # Win + M → Выход
bind = $mainMod, E, exec, $fileManager  # Win + E → Файловый менеджер
bind = $mainMod, V, togglefloating,     # Win + V → Плавающее окно
    bind = $mainMod, R, exec, $menu         # Win + R → Меню
    bind = $mainMod, P, pseudo,             # Win + P → Псевдо-тайлинг (dwindle)
bind = $mainMod, J, togglesplit,        # Win + J → Смена разделения (dwindle)
    bind = $mainMod, L, exec, $hyprlock     # Win + L → Блокировка экрана
    bind = $mainMod, F, exec, $browser      # ← ДОБАВЛЕНО: Win + F → Firefox
    bind = $mainMod, T, exec, $Telegram     # Telegram

    bind = ,Print, exec, bash -c 'mkdir -p ~/Screenshots && grim ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png'

    bind = SHIFT, Print, exec, bash -c 'mkdir -p ~/Screenshots && grim -g "$(slurp -d)" - | tee ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy'


# Перемещение фокуса: Win + стрелки
    bind = $mainMod, left,  movefocus, l
    bind = $mainMod, right, movefocus, r
    bind = $mainMod, up,    movefocus, u
    bind = $mainMod, down,  movefocus, d

# Рабочие столы: Win + [0-9]
    bind = $mainMod, 1, workspace, 1
    bind = $mainMod, 2, workspace, 2
    bind = $mainMod, 3, workspace, 3
    bind = $mainMod, 4, workspace, 4
    bind = $mainMod, 5, workspace, 5
    bind = $mainMod, 6, workspace, 6
    bind = $mainMod, 7, workspace, 7
    bind = $mainMod, 8, workspace, 8
    bind = $mainMod, 9, workspace, 9
    bind = $mainMod, 0, workspace, 10

# Перемещение окон на столы: Win + Shift + [0-9]
    bind = $mainMod SHIFT, 1, movetoworkspace, 1
    bind = $mainMod SHIFT, 2, movetoworkspace, 2
    bind = $mainMod SHIFT, 3, movetoworkspace, 3
    bind = $mainMod SHIFT, 4, movetoworkspace, 4
    bind = $mainMod SHIFT, 5, movetoworkspace, 5
    bind = $mainMod SHIFT, 6, movetoworkspace, 6
    bind = $mainMod SHIFT, 7, movetoworkspace, 7
    bind = $mainMod SHIFT, 8, movetoworkspace, 8
    bind = $mainMod SHIFT, 9, movetoworkspace, 9
    bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Специальный стол (scratchpad)
    bind = $mainMod, S, togglespecialworkspace, magic
    bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Прокрутка рабочих столов: Win + колёсико
    bind = $mainMod, mouse_down, workspace, e-1
    bind = $mainMod, mouse_up, workspace, e+1

# Перемещение/изменение размера окон: Win + ЛКМ/ПКМ + drag
    bindm = $mainMod, mouse:272, movewindow
    bindm = $mainMod, mouse:273, resizewindow

# Мультимедиа-клавиши ноутбука (громкость, яркость)
    bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
    bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
    bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
    bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Музыка (требует playerctl)
    bindl = , XF86AudioNext, exec, playerctl next
    bindl = , XF86AudioPause, exec, playerctl play-pause
    bindl = , XF86AudioPlay, exec, playerctl play-pause
    bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### ОКНА И РАБОЧИЕ СТОЛЫ ###
##############################

# Правила окон: https://wiki.hypr.land/Configuring/Window-Rules/
# Правила столов: https://wiki.hypr.land/Configuring/Workspace-Rules/

# Полезные правила окон

    windowrule {
# Игнорировать запросы на максимизацию от всех приложений
        name = suppress-maximize-events
            match:class = .*
            suppress_event = maximize
    }

windowrule {
# Исправление проблем с перетаскиванием в XWayland
    name = fix-xwayland-drags
        match:class = ^$
        match:title = ^$
        match:xwayland = true
        match:float = true
        match:fullscreen = false
        match:pin = false
        no_focus = true
}

# Правило для hyprland-run (меню запуска)
windowrule {
    name = move-hyprland-run
        match:class = hyprland-run
        move = 20 monitor_h-120
        float = yes
}

# Правило для окна "Свойства файла" в Nemo (центрированное)
windowrule {
    name = move-nemo-properties
        match:class = nemo
        match:title = .*(Свойства|Properties).*
        float = yes
        center = yes
}

# Правило для окна "Извлечь" в Nemo (центрированное)
windowrule {
    name = Извлечь
        match:class = org.gnome.FileRoller
        match:title = .*(Извлечь).*
        float = yes
        center = yes
}

windowrule {
    name = gimp-no-float
        match:class = gimp|firefox|org.telegram.desktop
        opacity = 1.0 override 1.0 override
}


windowrule {
    name = Wallpapers
        match:title = .*(Wallpapers).*
        match:class = xdg-desktop-portal-gtk
        float = yes
        center = yes
        max_size = 500 500
}

windowrulev2 = plugin:hyprbars:nobar,floating:0
