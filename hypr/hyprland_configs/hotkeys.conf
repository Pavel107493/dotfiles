#######################
### ПРИВЯЗКИ КЛАВИШ ###
#######################

# https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER         # Win как основной модификатор

# Основные привязки, подробности: https://wiki.hypr.land/Configuring/Binds/
bind = $mainMod, D, exec, discord
bind = $mainMod, Q, exec, $terminal_2     # Win + Q → Терминал
bind = $mainMod, A, exec, $terminal_2 --config-file .config/alacritty/plus_zellij.toml
bind = $mainMod, C, killactive,         # Win + C → Закрыть окно
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit  # Win + M → Выход
bind = $mainMod, E, exec, $fileManager  # Win + E → Файловый менеджер
bind = $mainMod, R, exec, ~/.config/hypr/hyprland_configs/scripts/wofi_toggle.sh         # Win + R → Меню
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod, L, exec, $hyprlock     # Win + L → Блокировка экрана
bind = $mainMod, F, exec, $browser      # ← ДОБАВЛЕНО: Win + F → Firefox
bind = $mainMod, T, exec, $Telegram     # Telegram
bind = $mainMod, X, exec, xed
bind = $mainMod, S, exec, wlogout
bind = $mainMod, H, exec, ~/.config/hypr/hyprland_configs/scripts/cliphist_toggle.sh 
bind = $mainMod, N, exec, swaync-client -t



####### СКРИНШОТЫ ЭКРАНА
bind = SHIFT, Print, exec, bash -c 'mkdir -p ~/Screenshots && grim -g "$(slurp -d)" - | tee ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy'

bind = ,Print, exec, bash -c 'mkdir -p ~/Screenshots && grim ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png'

bind = $mainMod SHIFT, W, exec, bash -c ~/.config/hypr/set-background-zenity.sh
bind = $mainMod, W, exec, bash -c ~/.config/hypr/set-background-rofi.sh

# Перемещение фокуса: Win + стрелки
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Перемещение окон: Win + Shift + стрелки
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Рабочие столы: Win + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Перемещение окон на столы: Win + Shift + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Рабочие столы (numpad по позициям цифр)
bind = $mainMod, KP_End, workspace, 1        # 1
bind = $mainMod, KP_Down, workspace, 2       # 2
bind = $mainMod, KP_Page_Down, workspace, 3  # 3
bind = $mainMod, KP_Left, workspace, 4       # 4
bind = $mainMod, KP_Begin, workspace, 5      # 5
bind = $mainMod, KP_Right, workspace, 6      # 6
bind = $mainMod, KP_Home, workspace, 7       # 7
bind = $mainMod, KP_Up, workspace, 8         # 8
bind = $mainMod, KP_Page_Up, workspace, 9    # 9
bind = $mainMod, KP_Insert, workspace, 10    # 0

# Перемещение окон
bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Page_Down, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 7
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 8
bind = $mainMod SHIFT, KP_Page_Up, movetoworkspace, 9
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 10

# Перемещение окон на столы: Win + Shift + j/k
bind = $mainMod SHIFT, J, movetoworkspace, -1
bind = $mainMod SHIFT, K, movetoworkspace, +1

# Прокрутка рабочих столов: Win + j/k
bind = $mainMod, J, workspace, -1
bind = $mainMod, K, workspace, +1

# Перемещение/изменение размера окон: Win + ЛКМ/ПКМ + drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = SUPER, I, resizeactive, 180 100
bind = $mainMod, U, resizeactive, -180 -100


# Мультимедиа-клавиши ноутбука (громкость, яркость)
    bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
    bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
    bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
    bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Музыка (требует playerctl)
    bindl = , XF86AudioNext, exec, playerctl next
    bindl = , XF86AudioPause, exec, playerctl play-pause
    bindl = , XF86AudioPlay, exec, playerctl play-pause
    bindl = , XF86AudioPrev, exec, playerctl previous
