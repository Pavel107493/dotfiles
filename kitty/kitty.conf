######################################################################
# ОСНОВНЫЕ НАСТРОЙКИ
######################################################################

font_family      CaskaydiaMono NFM
# или твой шрифт, напр. JetBrainsMono Nerd Font
bold_font        CaskaydiaMono NFM Bold
italic_font      CaskaydiaMono NFM Italic
bold_italic_font CaskaydiaMono NFM Bold Italic
font_size 9.5
adjust_cell_width 1.05  
macos_thicken_font -0.1  
background_opacity 0.9

disable_ligatures always
font_features Monospace-Regular -liga  # PS-name из kitty +list-fonts --psnames
cursor_trail 1



# box_drawing_scale 0.001 1 1.5 2
# disable_ligatures never
# symbol_map U+E0A0-U+E0A3,U+E0C7 PowerlineSymbols

######################################################################
# КУРСОР И МИГАНИЕ
######################################################################

cursor_shape block
#block
# cursor_blink_interval 0
# cursor_beam_thickness 1.5
# cursor_stop_blinking_after 15.0
# cursor_shape_unfocused hollow

######################################################################
# СКРОЛЛБЭК И СКРОЛЛБАР
######################################################################

# scrollback_lines 10000
# scrollbar_width  0
# scrollback_pager_history_size 0
# wheel_scroll_multiplier 5.0

######################################################################
# МЫШЬ И ВЫДЕЛЕНИЕ
######################################################################

mouse_hide_wait  3.0
copy_on_select   yes
# strip_trailing_spaces smart
# url_style        curly
# detect_urls      yes
# focus_follows_mouse no

######################################################################
# ОКНА И РАБОТА С ОС
######################################################################

window_padding_width 12
window_border_width 0

# window_border_style solid
macos_titlebar_color none
