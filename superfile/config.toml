##############################################
#                                            #
#           Конфигурация Superfile           #
#                                            #
##############################################

# Это корневой файл конфигурации для superfile! Подробности можно найти на
# [https://superfile.dev/configure/superfile-config/](https://superfile.dev/configure/superfile-config/).

###############################################################################
#                                   Основные настройки                        #
###############################################################################

#-- Редактор файлов
# По умолчанию: $EDITOR
editor = "nvim"

#-- Редактор директорий
dir_editor = ""

#-- Автоматическая проверка обновлений
auto_check_update = true

#-- Переход в директорию при выходе
# Переходить ли в последнюю открытую директорию в superfile при выходе из программы?
cd_on_quit = false

#-- Предварительный просмотр файлов
# Показывать ли предварительный просмотр файла при наведении на него курсора?
default_open_file_preview = true

#-- Предварительный просмотр изображений
# Показывать ли предварительный просмотр изображения при наведении на него курсора?
show_image_preview = true

#-- Информация о файле в футере
# Показывать ли в нижней части панели файлов дополнительную информацию о файле?
show_panel_footer_info = true

#-- Директория по умолчанию
# Начальный путь для панели файлов при запуске superfile.
# Поддерживает относительные пути: ".", "..", и т.д.
default_directory = "."

#-- Единицы измерения размера файлов
# true: десятичные SI единицы (1000): кБ, МБ, ГБ
# false: двоичные IEC единицы (1024): КиБ, МиБ, ГиБ
file_size_use_si = false

#-- Тип сортировки по умолчанию
# (0: Имя, 1: Размер, 2: Дата изменения, 3: Тип)
default_sort_type = 0

#-- Обратный порядок сортировки
# true: По убыванию
# false: По возрастанию
sort_order_reversed = false

#-- Учёт регистра при сортировке (только для сортировки по имени)
# Заглавная "Б" идёт перед строчной "а", если true
case_sensitive_sort = false

#-- Выход из шелла при успешном выполнении
# Закрывать ли шелл после успешного выполнения команды
shell_close_on_success = true

#-- Размер прокрутки страницы
# Количество строк для прокрутки при PgUp/PgDown (0: полная страница, поведение по умолчанию)
page_scroll_size = 0

#-- Режим отладки
debug = false

#-- Игнорировать отсутствующие поля конфига
# Подавлять ли предупреждения о недостающих полях конфигурации
ignore_missing_fields = false

#-- Количество дополнительных колонок в панели файлов
# Количество доп. колонок в панели файлов помимо имени файла. 0 = функция отключена
file_panel_extra_columns = 0

#-- Ширина имён файлов в панели
# Процент ширины панели файлов для имён (25-100). Больше места для имён = меньше для доп. колонок
file_panel_name_percent = 50


###############################################################################
#                                   Оформление                                #
###############################################################################

#-- Тема
# Укажите здесь имя вашей темы!
theme = "catppuccin"
# "ayu-dark"

#-- Предпросмотр кода
# Использовать встроенное подсвечивание синтаксиса chroma или bat. 
# "" = встроенный chroma, "bat" = bat
code_previewer = "bat"

#-- Поддержка Nerd Fonts
# Включить поддержку символов Nerd Fonts
# Требует: шрифт с патчем Nerd Fonts
nerdfont = true

#-- Показывать иконки чекбоксов в режиме выбора
# Требует: nerdfont = true
show_select_icons = true

#-- Прозрачный фон
# true = включить прозрачность фона
# Требует: поддержка прозрачности в терминале
transparent_background = true

#-- Ширина панели предпросмотра файлов
# Ширина панели предпросмотра = 1/n от общей ширины (рекомендуется 2–10)
# 0 = такая же ширина как у панели выбора файлов
file_preview_width = 0 

#-- Рамка предпросмотра файлов
# Включить рамку вокруг панели предпросмотра для лучшего визуального разделения
# По умолчанию: false (без рамки)
enable_file_preview_border = true

#-- Ширина боковой панели
# 0 = скрыть боковую панель
# Рекомендуется 5–20
sidebar_width = 0

#-- Рамки
# Используйте символы шириной ровно 1 символ!
# ' ' = без рамок
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'


###############################################################################
#                                   Плагины                                   #
###############################################################################

# Раздел для плагинов superfile - внешних дополнений, расширяющих возможности программы!
# Подробнее: [https://superfile.dev/list/plugin-list/](https://superfile.dev/list/plugin-list/).

#-- Детальная информация о метаданных
# Требует: exiftool
metadata = false

#-- Генерация MD5-хешей
# Требует: md5sum
enable_md5_checksum = false

#-- Поддержка Zoxide - умная навигация по директориям!
# Требует: zoxide
zoxide_support = false

#-- Правила открытия файлов
# Сопоставление расширений файлов с командами для их открытия
# Путь к файлу добавляется как последний аргумент
# ДОЛЖЕН БЫТЬ В КОНЦЕ ФАЙЛА! TOML не может закрывать таблицы
# Пример:
#   png = "feh"
#   pdf = "zathura"
#   conf = "nvim"
[open_with]
